[package]
name = "gpui_playground"
version = "0.1.0"
edition.workspace = true
publish = false
license = "Apache-2.0"
description = "Interactive developer playground for GPUI components and Lucide icons"

[lints]
workspace = true

[dependencies]
anyhow = { workspace = true }
async-channel = { workspace = true }
futures = { workspace = true }
gpui = { workspace = true, features = ["components", "lucide"] }
gpui_platform = { workspace = true, features = ["font-kit", "wayland", "x11"] }
http_client = { workspace = true }
reqwest_client = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
gpui = { workspace = true, features = ["components", "lucide", "test-support"] }
